networks:
  frame_recall_network:
    driver: bridge

volumes:
  mongodb_data:
  mongodb_backup:

services:
  mongodb:
    image: mongo:8.3
    container_name: ${SERVICE_NAME}
    hostname: ${MONGO_DNS_NAME}
    networks:
      - frame_recall_network
    ports:
      - "${MONGO_PORT}:27017"
      - "${MONGO_ALT_PORT}:27017"
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_INIT_DB}
    volumes:
      - mongodb_data:${MONGO_DATA_PATH}
      - mongodb_backup:${MONGO_BACKUP_PATH}
      - ./init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${MONGO_MEMORY_LIMIT}
          cpus: '${MONGO_CPUS_LIMIT}'
        reservations:
          memory: 512m
          cpus: '0.5'
    logging:
      driver: ${MONGO_LOG_DRIVER}
      options:
        max-size: ${MONGO_LOG_MAX_SIZE}
        max-file: ${MONGO_LOG_MAX_FILE}
        labels: "service=${SERVICE_NAME},solution=${SOLUTION_NAME}"
