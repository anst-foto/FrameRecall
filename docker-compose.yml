networks:
  frame_recall_network:
    driver: bridge

volumes:
  mongodb_data:
  mongodb_backup:

services:
  mongodb:
    image: mongo:8.3
    networks:
      - frame_recall_network
    ports:
      - "127.0.0.1:${MONGO_PORT}:27017"
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_INIT_DB}
    volumes:
      - mongodb_data:/data/db
      - mongodb_backup:/data/backup
      - ./init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    mem_limit: ${MONGO_MEMORY_LIMIT}
    cpus: ${MONGO_CPUS_LIMIT}
    logging:
      driver: ${MONGO_LOG_DRIVER}
      options:
        max-size: "${MONGO_LOG_MAX_SIZE}"
        max-file: "${MONGO_LOG_MAX_FILE}"